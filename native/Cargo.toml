[package]
name = "myscreen-native"
version = "0.1.0"
edition = "2021"
description = "Som do sistema (loopback por processo do WASAPI) e controle remoto (SendInput) do MyScreen"
license = "MIT"
publish = false

[lib]
# cdylib vira o .node carregado pelo Electron; rlib deixa o `cargo test` rodar
# a parte de DSP sem Node.
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "3", features = ["napi6"] }
napi-derive = "3"
sysinfo = "0.39.6"
wasapi = "0.25.0"
windows-sys = { version = "0.59", features = [
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_System_IO",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
